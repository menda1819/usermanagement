spring.application.name=usermanagement
server.port=8080

# MS SQL Server DataSource Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=usermanagement_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Imms1922@sep*

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Thymeleaf Development Settings
spring.thymeleaf.cache=false