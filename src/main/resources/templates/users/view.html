<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>User Details</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"> 
</head> 
<body class="bg-light"> 
<nav class="navbar navbar-dark bg-dark mb-4"> 
    <div class="container"> 
        <a class="navbar-brand fw-bold" href="/users"><i class="bi bi-people-fill me-2"></i>User Management System</a> 
    </div>
</nav> 
<div class="container" style="max-width: 600px;"> 
    <div class="card shadow-sm border-0"> 
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center"> 
            <h5 class="mb-0 fw-bold">User Profile</h5> 
            <span th:if="${user.active}" class="badge bg-success">Active</span> 
            <span th:unless="${user.active}" class="badge bg-secondary">Inactive</span> 
        </div> 
        <div class="card-body p-4"> 
            <div class="text-center mb-4"> 
                <i class="bi bi-person-circle display-4 text-primary"></i> 
                <h4 class="mt-2 fw-bold" th:text="${user.firstName + ' ' + user.lastName}"></h4> 
                <p class="text-muted" th:text="${'@' + user.username}"></p> 
            </div> 
            <ul class="list-group list-group-flush border-top border-bottom"> 
                <li class="list-group-item d-flex justify-content-between"> 
                    <span class="text-muted">User ID</span> 
                    <span class="fw-semibold" th:text="${user.id}"></span> 
                </li> 
                <li class="list-group-item d-flex justify-content-between"> 
                    <span class="text-muted">Email</span> 
                    <span class="fw-semibold" th:text="${user.email}"></span> 
                </li> 
                <li class="list-group-item d-flex justify-content-between"> 
                    <span class="text-muted">Phone</span> 
                    <span class="fw-semibold" th:text="${user.phone != null ? user.phone : 'N/A'}"></span> 
                </li> 
                <li class="list-group-item d-flex justify-content-between"> 
                    <span class="text-muted">Role</span> 
                    <span class="badge bg-info text-dark" th:text="${user.role}"></span> 
                </li> 
                <li class="list-group-item d-flex justify-content-between"> 
                    <span class="text-muted">Created At</span> 
                    <span class="small text-muted" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span> 
                </li> 
                <li class="list-group-item d-flex justify-content-between"> 
                    <span class="text-muted">Last Updated</span> 
                    <span class="small text-muted" th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></span> 
                </li> 
            </ul> 
            <div class="mt-4 d-flex justify-content-end gap-2"> 
                <a href="/users" class="btn btn-outline-secondary">Back to List</a> 
                <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-primary"><i class="bi bi-pencil me-1"></i>Edit</a> 
            </div> 
        </div> 
    </div>
</div> 
</body> 
</html>
