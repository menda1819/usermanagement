<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit User — User Management System' : 'Create New User — User Management System'">User Form</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --header-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
        }
        .navbar-custom {
            background: var(--header-gradient);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
        }
        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border-color: #cbd5e1;
            padding: 0.65rem 0.85rem;
            font-size: 0.95rem;
            transition: all 0.15s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .input-group-text {
            border-radius: 8px 0 0 8px;
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
        }
        .form-switch .form-check-input {
            width: 2.75em;
            height: 1.45em;
            cursor: pointer;
        }
        .form-switch .form-check-input:checked {
            background-color: #10b981;
            border-color: #10b981;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold fs-5 text-white" href="/users">
            <span class="p-2 rounded-3 bg-primary me-2 d-inline-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
                <i class="bi bi-shield-check text-white fs-6"></i>
            </span>
            User Management System
        </a>
    </div>
</nav>

<div class="container pb-5" style="max-width: 720px;">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="/users" class="text-decoration-none text-muted"><i class="bi bi-house me-1"></i>Directory</a></li>
            <li class="breadcrumb-item active text-dark fw-semibold" aria-current="page" th:text="${isEdit} ? 'Edit User #' + ${userId} : 'Create New User'">Create New User</li>
        </ol>
    </nav>

    <!-- Form Card -->
    <div class="card border-0 bg-white">
        <div class="card-header bg-white py-3 px-4 border-bottom d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <span class="p-2 rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                    <i th:class="${isEdit} ? 'bi bi-pencil-fill' : 'bi bi-person-plus-fill'"></i>
                </span>
                <div>
                    <h5 class="mb-0 fw-bold text-dark" th:text="${isEdit} ? 'Edit User Account' : 'Create New User Account'"></h5>
                    <span class="small text-muted" th:text="${isEdit} ? 'Update employee profile details, role, and active status.' : 'Register a new employee into MS SQL Server.'"></span>
                </div>
            </div>
            <span th:if="${isEdit}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1">ID: [[${userId}]]</span>
        </div>

        <div class="card-body p-4">
            <form th:action="@{/users/save}" th:object="${user}" method="post">
                <input type="hidden" name="id" th:value="${userId}" th:if="${isEdit}">

                <div class="row g-3">
                    <!-- First Name -->
                    <div class="col-md-6">
                        <label class="form-label">First Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" th:field="*{firstName}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                    </div>

                    <!-- Last Name -->
                    <div class="col-md-6">
                        <label class="form-label">Last Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" th:field="*{lastName}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div class="col-12">
                        <label class="form-label">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid" placeholder="name@company.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <!-- Username -->
                    <div class="col-md-6">
                        <label class="form-label">Username <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-at"></i></span>
                            <input type="text" class="form-control" th:field="*{username}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <!-- Role -->
                    <div class="col-md-6">
                        <label class="form-label">System Role <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <select class="form-select" th:field="*{role}">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Active Toggle Switch -->
                    <div class="col-md-6 d-flex align-items-center">
                        <div class="p-3 bg-light rounded-3 w-100 border mt-2">
                            <div class="form-check form-switch d-flex align-items-center justify-content-between ps-0 mb-0">
                                <div>
                                     <label class="form-check-label fw-semibold text-dark d-block" for="activeCheck">Active Account</label>
                                     <span class="small text-muted">Set account active or deactivated</span>
                                </div>
                                <input class="form-check-input ms-2" type="checkbox" th:field="*{active}" id="activeCheck">
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                        <a href="/users" class="btn btn-outline-secondary px-4 rounded-3">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 rounded-3 d-inline-flex align-items-center gap-2">
                            <i class="bi bi-check2-circle"></i>
                            <span th:text="${isEdit} ? 'Update User' : 'Create User'">Save User</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
