<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title th:text="${isEdit} ? 'Edit User' : 'Create User'">User Form</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"> 
</head> 
<body class="bg-light"> 
<nav class="navbar navbar-dark bg-dark mb-4"> 
    <div class="container"> 
        <a class="navbar-brand fw-bold" href="/users"><i class="bi bi-people-fill me-2"></i>User Management System</a> 
    </div>
</nav> 
<div class="container" style="max-width: 650px;"> 
    <div class="card shadow-sm border-0"> 
        <div class="card-header bg-white py-3"> 
            <h4 class="mb-0 fw-bold" th:text="${isEdit} ? 'Edit User' : 'Create New User'"></h4> 
        </div> 
        <div class="card-body p-4"> 
            <form th:action="@{/users/save}" th:object="${user}" method="post"> 
                <input type="hidden" name="id" th:value="${userId}" th:if="${isEdit}"> 
                <div class="row g-3"> 
                    <div class="col-md-6"> 
                        <label class="form-label fw-semibold">First Name *</label> 
                        <input type="text" class="form-control" th:field="*{firstName}" th:errorclass="is-invalid"> 
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div> 
                    </div> 
                    <div class="col-md-6"> 
                        <label class="form-label fw-semibold">Last Name *</label> 
                        <input type="text" class="form-control" th:field="*{lastName}" th:errorclass="is-invalid"> 
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div> 
                    </div> 
                    <div class="col-12"> 
                        <label class="form-label fw-semibold">Email Address *</label> 
                        <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"> 
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div> 
                    </div> 
                    <div class="col-md-6"> 
                        <label class="form-label fw-semibold">Username *</label> 
                        <input type="text" class="form-control" th:field="*{username}" th:errorclass="is-invalid"> 
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div> 
                    </div> 
                    <div class="col-md-6"> 
                        <label class="form-label fw-semibold">Phone Number</label> 
                        <input type="text" class="form-control" th:field="*{phone}" th:errorclass="is-invalid"> 
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div> 
                    </div> 
                    <div class="col-md-6"> 
                        <label class="form-label fw-semibold">Role *</label> 
                        <select class="form-select" th:field="*{role}"> 
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option> 
                        </select> 
                    </div> 
                    <div class="col-md-6 d-flex align-items-center"> 
                        <div class="form-check mt-4"> 
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck"> 
                            <label class="form-check-label fw-semibold" for="activeCheck">Active Account</label> 
                        </div> 
                    </div> 
                    <div class="col-12 mt-4 pt-2 border-top d-flex justify-content-end gap-2"> 
                        <a href="/users" class="btn btn-outline-secondary">Cancel</a> 
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i>Save User</button> 
                    </div> 
                </div> 
            </form> 
        </div> 
    </div>
</div> 
</body> 
</html>
