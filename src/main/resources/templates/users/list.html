<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/users">
            <i class="bi bi-people-fill me-2"></i>User Management System
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-secondary">User Directory</h3>
        <a href="/users/new" class="btn btn-primary shadow-sm">
            <i class="bi bi-person-plus-fill me-1"></i>Add New User
        </a>
    </div>

    <!-- Search Form -->
    <div class="card mb-3 shadow-sm border-0">
        <div class="card-body">
            <form class="row g-2" th:action="@{/users}" method="get">
                <div class="col-md-5">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name or email...">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-secondary"><i class="bi bi-search me-1"></i>Search</button>
                    <a href="/users" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center py-4 text-muted">No users found.</td>
                        </tr>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td class="fw-semibold" th:text="${user.firstName + ' ' + user.lastName}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span th:if="${user.role != null and user.role.name() == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                                <span th:if="${user.role != null and user.role.name() == 'MANAGER'}" class="badge bg-warning text-dark">MANAGER</span>
                                <span th:if="${user.role != null and user.role.name() == 'USER'}" class="badge bg-info text-dark">USER</span>
                            </td>
                            <td>
                                <span th:if="${user.active}" class="badge bg-success">Active</span>
                                <span th:unless="${user.active}" class="badge bg-secondary">Inactive</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/users/view/{id}(id=${user.id})}" class="btn btn-sm btn-outline-info me-1" title="View">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to deactivate this user?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Deactivate">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3" th:if="${totalPages != null and totalPages > 1}">
        <span class="text-muted small">Page [[${currentPage + 1}]] of [[${totalPages}]]</span>
        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/users(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/users(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
            </li>
        </ul>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
